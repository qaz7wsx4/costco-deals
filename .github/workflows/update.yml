name: 每日更新特價

on:
  schedule:
    # GitHub 用 UTC；對應台灣時間 00:20（新檔期開始）與 07:00
    - cron: "20 16 * * *"
    - cron: "0 23 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 抓取官網特價
        id: fetch
        continue-on-error: true
        run: python3 scripts/fetch.py

      - name: 把新資料存回 repo
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "資料沒有變化"
          else
            git commit -m "更新特價資料 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git push
          fi

      # 就算這次抓取失敗，也用上一份資料照常發佈網站
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: 抓取失敗時讓這次執行顯示為失敗（GitHub 會寄信通知）
        if: steps.fetch.outcome != 'success'
        run: exit 1
